<!DOCTYPE html>
<html>
<head>
    <title>登录-CommonDiary</title>
    <meta charset="UTF-8">
    <link rel="icon" href="assets/icon.ico">
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="assets/js/navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase.js"></script>
</head>
<body onload="loadNavbar(),loginbtn()">

    <div id="navbar-foundation" class="navbar"></div>
    <br><br><br><br>
    <fieldset>
        <p>登录以使用更多操作：</p><br>
        <form id="login-form">
            <label for="username">邮箱：</label>
            <input type="email" id="username" name="username" required><br><br>
            <label for="password">密码：</label>
            <input type="password" id="password" name="password" required><br><br>
            <input type="submit" value="登录">
        </form>
        <p>还没有账号？<a href="register.html" style="color:aqua;">注册</a></p>
    </fieldset>

</body>
</html>
